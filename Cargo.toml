[workspace]
resolver = "3"
members = ["crates/domain", "crates/vision", "crates/infra", "crates/api", "crates/app", "crates/frontend", "crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
# internal
domain = { path = "crates/domain" }
infra = { path = "crates/infra" }
vision = { path = "crates/vision" }
api = { path = "crates/api" }
app = { path = "crates/app", default-features = false }

# web / runtime
axum = { version = "0.8.4", features = ["multipart", "macros"] }
tokio = { version = "1.46.1", features = ["full"] }
tower = "0.5.2"
tower-http = { version = "0.6.6", features = ["cors", "trace", "timeout"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }

# leptos
leptos = "0.8.23"
leptos_axum = "0.8.10"
leptos_meta = "0.8"
leptos_router = "0.8"
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1.7"

# data
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-native-tls", "postgres", "chrono", "uuid", "rust_decimal", "migrate", "macros"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
chrono = { version = "0.4.41", features = ["serde"] }
uuid = { version = "1.17.0", features = ["serde"] }
# default serde impl serializes Decimal as a string ("12.50") — no float precision loss for money
rust_decimal = { version = "1.37", features = ["macros"] }
validator = { version = "0.20.0", features = ["derive"] }
regex = "1.12.3"

# security / misc
argon2 = "0.5.3"
jsonwebtoken = "9.3.1"
dotenvy = "0.15.7"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[[workspace.metadata.leptos]]
name = "library"
bin-package = "server"
lib-package = "frontend"
site-root = "target/site"
site-pkg-dir = "pkg"
tailwind-input-file = "style/tailwind.css"
assets-dir = "public"
site-addr = "127.0.0.1:3000"
reload-port = 3001
browserquery = "defaults"
env = "DEV"
lib-profile-release = "wasm-release"

# Face models are slow unoptimised; keep inference fast in dev builds.
[profile.dev.package.tract-core]
opt-level = 3
[profile.dev.package.tract-linalg]
opt-level = 3
[profile.dev.package.tract-onnx]
opt-level = 3
[profile.dev.package.tract-hir]
opt-level = 3
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.vision]
opt-level = 3
