[package]
name = "app"
description = "Leptos UI: components + server functions (ssr / hydrate)."
version.workspace = true
edition.workspace = true

[dependencies]
domain.workspace = true
leptos.workspace = true
leptos_meta.workspace = true
leptos_router.workspace = true
serde.workspace = true
uuid.workspace = true
leptos_axum = { workspace = true, optional = true }
infra = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
validator = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
# Browser camera (hydrate only)
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", optional = true, features = [
  "Window", "Navigator", "Document", "Element", "MediaDevices", "MediaStreamConstraints",
  "MediaStream", "MediaStreamTrack", "HtmlVideoElement", "HtmlCanvasElement", "HtmlImageElement",
  "CanvasRenderingContext2d", "HtmlInputElement", "FileList", "File", "Blob", "FileReader",
] }

[features]
default = []
hydrate = ["leptos/hydrate", "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:js-sys", "dep:web-sys"]
ssr = [
  "leptos/ssr",
  "leptos_meta/ssr",
  "leptos_router/ssr",
  "dep:leptos_axum",
  "dep:infra",
  "dep:axum",
  "dep:validator",
  "dep:tracing",
]
